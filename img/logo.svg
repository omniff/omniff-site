<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Omniff logosu: özgün; yalnızca basit geometri. Mercek içindeki dört renkli karo = farklı dosya türleri (belge, resim, klasör, kod): "her şeyi bulur". -->
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B4CCA"/>
      <stop offset="1" stop-color="#1E2A78"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#bg)"/>

  <!-- sap -->
  <line x1="624" y1="624" x2="810" y2="810" stroke="#FFFFFF" stroke-width="92" stroke-linecap="round"/>
  <!-- mercek -->
  <circle cx="460" cy="460" r="244" fill="#FFFFFF"/>
  <circle cx="460" cy="460" r="176" fill="#1E2A78"/>

  <!-- dört dosya türü -->
  <circle cx="395" cy="395" r="58" fill="#4C8DFF"/>
  <rect x="470" y="332" width="104" height="126" rx="24" fill="#FFB020"/>
  <rect x="342" y="470" width="106" height="106" rx="22" fill="#2FCB8B" transform="rotate(45 395 523)"/>
  <rect x="472" y="480" width="120" height="86" rx="26" fill="#FF6B8A"/>
</svg>
